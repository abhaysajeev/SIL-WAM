<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — SIL WhatsApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<main class="auth">

  <div class="auth-brand">
    <img src="/static/img/sil_logo_mark.png" alt="" class="auth-logo" width="64" height="64">
    <span class="auth-brand-name">SIL WhatsApp</span>
  </div>

  <div class="auth-card">
    <h1 class="auth-title">Sign in</h1>
    <p class="auth-sub">Manage WhatsApp Business messaging.</p>

    <div id="errorContainer" aria-live="assertive"></div>

    <form id="loginForm" class="auth-form" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="auth-input"
               required autofocus autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>

      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="password" name="password" class="auth-input"
                 required autocomplete="current-password">
          <button type="button" class="auth-reveal" id="pwdToggle"
                  aria-label="Show password" aria-pressed="false">
            <i class="ti ti-eye" id="pwdIcon" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-submit" id="loginBtn">
        <span class="btn-label">Sign in</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
    </form>
  </div>

  <p class="auth-foot">Forgot your password? Ask an administrator to reset it.</p>

</main>

<script>
  (function () {
    var pwdInput  = document.getElementById('password');
    var pwdToggle = document.getElementById('pwdToggle');
    var pwdIcon   = document.getElementById('pwdIcon');

    pwdToggle.addEventListener('click', function () {
      var show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      pwdIcon.className = show ? 'ti ti-eye-off' : 'ti ti-eye';
      pwdToggle.setAttribute('aria-pressed', show ? 'true' : 'false');
      pwdToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    function showError(msg) {
      var box = document.createElement('div');
      box.className = 'auth-error';
      box.setAttribute('role', 'alert');
      box.innerHTML = '<i class="ti ti-alert-circle" aria-hidden="true"></i>';
      var text = document.createElement('span');
      text.textContent = msg;
      box.appendChild(text);
      var c = document.getElementById('errorContainer');
      c.innerHTML = '';
      c.appendChild(box);
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      document.getElementById('errorContainer').innerHTML = '';

      var btn = document.getElementById('loginBtn');
      btn.classList.add('loading');

      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;

      try {
        var res = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username: username, password: password })
        });

        if (res.ok) {
          var data = await res.json();
          localStorage.setItem('wam_access_token',  data.access_token);
          localStorage.setItem('wam_refresh_token', data.refresh_token);
          window.location.href = '/dashboard';
        } else {
          var err = await res.json().catch(function () { return {}; });
          showError(res.status === 403
            ? 'Your account is disabled. Contact your administrator.'
            : (err.detail || 'Incorrect username or password.'));
          btn.classList.remove('loading');
        }
      } catch (_) {
        showError('Could not reach the server. Check your connection and try again.');
        btn.classList.remove('loading');
      }
    });
  })();
</script>

</body>
</html>
